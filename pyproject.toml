[project]
name = "regularizeNd"
version = "3.2.1"
description = "Python port and documentation tooling for the regularizeNd project."
license = {text = "MIT"}
requires-python = ">=3.14"

# Core dependencies required by the Python port (ports/python/regularize_nd.py)
dependencies = [
  "numpy>=1.25",
  "scipy>=1.11",
]

[dependency-groups]
dev = [
    "earthaccess>=0.16.0",
    "h5py>=3.16.0",
    "keyring>=25.7.0",
    "secretstorage>=3.5.0",
]
docs = [
  "furo",
  "myst-parser",
  "sphinx-autobuild",
  "sphinx>=8",
  "sphinxcontrib-matlabdomain",
]
test = [
  "pytest>=7",
]
publish = [
  "ghp-import"
]

[tool.uv]
# Use uv with the existing .venv created via `uv venv`
managed = true

[tool.uv.sources]
sphinxcontrib-matlabdomain = { git = "https://github.com/sphinx-contrib/matlabdomain.git", rev = "241941e28ed48f0712f1dfa7624f274592ca424b" }

[tool.pytest.ini_options]
testpaths = ["ports/python/tests"]
pythonpath = ["ports/python"]
